<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ইউজার ড্যাশবোর্ড ইউআই</title>
    <!-- আইকনের জন্য Font Awesome লিংক -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* মোবাইল স্ক্রিন কন্টেইনার */
        .app-container {
            width: 100%;
            max-width: 400px;
            background-color: #ffffff;
            min-height: 100vh;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* হেডার সেকশন */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 45px;
            height: 45px;
            background-color: #d9383a;
            color: white;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 18px;
        }

        .user-details p {
            font-size: 12px;
            color: #777;
        }

        .user-details h3 {
            font-size: 18px;
            color: #222;
        }

        .notification-icon {
            font-size: 20px;
            color: #555;
            cursor: pointer;
        }

        /* ব্যালেন্স কার্ড */
        .balance-card {
            margin: 0 20px;
            background: linear-gradient(135deg, #e53935, #b71c1c);
            color: white;
            padding: 25px 20px;
            border-radius: 16px;
            box-shadow: 0 6px 15px rgba(217, 56, 58, 0.3);
        }

        .balance-card p {
            font-size: 12px;
            letter-spacing: 1px;
            opacity: 0.9;
        }

        .balance-card h1 {
            font-size: 32px;
            margin: 8px 0 20px 0;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
        }

        .btn {
            flex: 1;
            background-color: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.3s;
        }

        .btn:hover {
            background-color: rgba(255, 255, 255, 0.3);
        }

        /* সার্ভিস গ্রিড সেকশন */
        .services-section {
            padding: 25px 20px;
            flex-grow: 1;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .section-header h4 {
            font-size: 15px;
            color: #333;
        }

        .section-header span {
            font-size: 12px;
            color: #d9383a;
            font-weight: bold;
            cursor: pointer;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .grid-item {
            background-color: #f8f9fa;
            padding: 15px 5px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .grid-item:hover {
            transform: translateY(-3px);
            background-color: #f1f3f5;
        }

        .grid-item i {
            font-size: 20px;
            color: #3b4b5e;
            margin-bottom: 8px;
        }

        .grid-item p {
            font-size: 12px;
            color: #444;
            font-weight: 500;
        }

        /* নিচের নেভিগেশন বার */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            border-top: 1px solid #eee;
            background-color: #fff;
        }

        .nav-item {
            text-align: center;
            color: #888;
            font-size: 12px;
            cursor: pointer;
        }

        .nav-item.active {
            color: #d9383a;
            font-weight: bold;
        }

        .nav-item i {
            font-size: 18px;
            display: block;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div>
            <!-- হেডার -->
            <div class="header">
                <div class="user-info">
                    <div class="avatar">MO</div>
                    <div class="user-details">
                        <p>ID: 1024589</p>
                        <h3>Momin</h3>
                    </div>
                </div>
                <div class="notification-icon">
                    <i class="fa-regular fa-bell"></i>
                </div>
            </div>

            <!-- ব্যালেন্স কার্ড -->
            <div class="balance-card">
                <p>CURRENT BALANCE</p>
                <h1>500.00 ৳</h1>
                <div class="action-buttons">
                    <button class="btn"><i class="fa-solid fa-plus"></i> ADD INCOME</button>
                    <button class="btn"><i class="fa-solid fa-minus"></i> EXPENSE</button>
                </div>
            </div>

            <!-- মেনু গ্রিড -->
            <div class="services-section">
                <div class="section-header">
                    <h4>MAIN SERVICES</h4>
                    <span>VIEW ALL</span>
                </div>
                <div class="grid-container">
                    <div class="grid-item">
                        <i class="fa-solid fa-chart-pie"></i>
                        <p>Budget</p>
                    </div>
                    <div class="grid-item">
                        <i class="fa-solid fa-briefcase"></i>
                        <p>Tasks</p>
                    </div>
                    <div class="grid-item">
                        <i class="fa-solid fa-clock-rotate-left"></i>
                        <p>History</p>
                    </div>
                    <div class="grid-item">
                        <i class="fa-solid fa-user-gear"></i>
                        <p>Profile</p>
                    </div>
                    <div class="grid-item">
                        <i class="fa-solid fa-chart-line"></i>
                        <p>Analytics</p>
                    </div>
                    <div class="grid-item">
                        <i class="fa-solid fa-headset"></i>
                        <p>Support</p>
                    </div>
                    <div class="grid-item">
                        <i class="fa-solid fa-piggy-bank"></i>
                        <p>Savings</p>
                    </div>
                    <div class="grid-item">
                        <i class="fa-solid fa-file-invoice"></i>
                        <p>Reports</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- বটম নেভিগেশন -->
        <div class="bottom-nav">
            <div class="nav-item active">
                <i class="fa-solid fa-house"></i>
                <span>Home</span>
            </div>
            <div class="nav-item">
                <i class="fa-solid fa-wallet"></i>
                <span>Wallet</span>
            </div>
            <div class="nav-item">
                <i class="fa-solid fa-list-check"></i>
                <span>Tasks</span>
            </div>
            <div class="nav-item">
                <i class="fa-solid fa-user"></i>
                <span>Account</span>
            </div>
        </div>
    </div>

</body>
  </html>
